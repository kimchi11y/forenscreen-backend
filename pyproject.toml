[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "imagehash>=4.3.2",
    "opencv-python-headless>=4.10.0",
    "pillow>=12.2.0",
    "pillow-heif>=1.1.0",
    "psycopg2-binary>=2.9.12",
    "py-solc-x>=2.0.0",
    "pyjwt[crypto]>=2.9",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.47.0",
    "web3>=7.0.0",
]

# Verification only - compiling, deploying and exercising the contract against
# an in-memory EVM. Not needed to run the app.
[project.optional-dependencies]
verify = ["eth-tester[py-evm]>=0.13"]
